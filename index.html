<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Lucas Kong: suba as vigas, desvie dos barris e resgate a Lara. Jogo para iPad, celular e computador.">
<meta name="theme-color" content="#0b0920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lucas Kong">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lucas Kong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap">
<style>
:root {
  /* Layout: tela cheia. Campo do jogo centralizado, controles de toque no espaço que sobra,
     menus como folhas por cima do jogo animado ao fundo. Visual único: obra em neon à noite. */
  --night: #0b0920;
  --panel: #161233;
  --panel-2: #211b49;
  --line: #3a3170;
  --steel: #ff5470;
  --steel-dk: #b8234a;
  --rung: #5ee7ff;
  --spark: #ffd166;
  --rose: #ff8fc7;
  --text: #f4f1ff;
  --muted: #a9a3cf;
  --danger: #ff6b6b;
  --font-display: "Bungee", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}

html,
body {
  height: 100%;
  background: var(--night);
  color: var(--text);
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

#app {
  position: fixed;
  inset: 0;
  background: radial-gradient(120% 80% at 50% 0%, #1c1648 0%, var(--night) 70%);
}

#play {
  position: absolute;
  top: env(safe-area-inset-top, 0px);
  right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px);
  touch-action: none;
}

#cv {
  position: absolute;
  display: block;
  border-radius: 6px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 20px 60px rgba(0, 0, 0, 0.5);
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid var(--rung);
  outline-offset: 2px;
}

/* ---------------------------------------------------------------- controles de toque */
.ctl {
  position: absolute;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  z-index: 2;
}

.pad {
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03) 70%);
  border: 2px solid rgba(255, 255, 255, 0.16);
  box-shadow: inset 0 0 0 10px rgba(0, 0, 0, 0.12);
}

.pad .ar {
  position: absolute;
  width: 28%;
  height: 28%;
  color: rgba(255, 255, 255, 0.45);
  transition: color 0.08s, transform 0.08s;
}

.pad .ar svg {
  width: 100%;
  height: 100%;
  fill: currentColor;
}

.pad .ar.u { left: 36%; top: 5%; }
.pad .ar.d { left: 36%; bottom: 5%; transform: rotate(180deg); }
.pad .ar.l { top: 36%; left: 5%; transform: rotate(-90deg); }
.pad .ar.r { top: 36%; right: 5%; transform: rotate(90deg); }

.pad[data-dir*="u"] .ar.u,
.pad[data-dir*="d"] .ar.d,
.pad[data-dir*="l"] .ar.l,
.pad[data-dir*="r"] .ar.r {
  color: var(--c, var(--rung));
}

.pad .knob {
  position: absolute;
  left: 36%;
  top: 36%;
  width: 28%;
  height: 28%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.14);
}

.jump {
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.4);
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.45), transparent 45%), var(--c, var(--steel));
  color: #fff;
  font-family: var(--font-display);
  font-size: clamp(12px, 2.6vmin, 18px);
  letter-spacing: 0.04em;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
  padding: 0;
}

.jump.down {
  transform: translateY(4px) scale(0.97);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}

.iconbtn {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.22);
  background: rgba(22, 18, 51, 0.8);
  color: var(--text);
  padding: 0;
  flex: none;
}

.iconbtn svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.iconbtn.ghost {
  background: transparent;
  border-color: transparent;
}

.iconbtn.small {
  width: 40px;
  height: 40px;
}

#btnPause {
  position: absolute;
  z-index: 3;
}

/* ---------------------------------------------------------------- telas */
#screens {
  position: absolute;
  inset: 0;
  z-index: 5;
}

.screen {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(11, 9, 32, 0.8), rgba(11, 9, 32, 0.94));
  -webkit-user-select: none;
  user-select: none;
  animation: fadeIn 0.18s ease-out;
}

.screen.dim {
  justify-content: center;
  background: rgba(8, 6, 24, 0.72);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .screen { animation: none; }
}

.bar {
  width: 100%;
  max-width: 560px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.bar h2 {
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: 0.03em;
  text-wrap: balance;
}

.sheet {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sheet.wide { max-width: 640px; }
.sheet.narrow { max-width: 420px; }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 12px 18px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font-weight: 800;
  font-size: 1.02rem;
  box-shadow: 0 4px 0 #07051a;
  transition: transform 0.07s, box-shadow 0.07s, background 0.15s;
}

.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #07051a; }
.btn:disabled { opacity: 0.55; }

.btn.primary {
  border-color: #ff8ea2;
  background: linear-gradient(180deg, #ff6f87, var(--steel));
  box-shadow: 0 5px 0 var(--steel-dk);
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: 0.04em;
  text-shadow: 0 2px 0 rgba(120, 10, 40, 0.35);
}

.btn.primary:active { box-shadow: 0 2px 0 var(--steel-dk); }
.btn.big { min-height: 64px; font-size: 1.35rem; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { border-color: var(--danger); background: rgba(255, 107, 107, 0.14); color: #ffd0d0; }

.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.link {
  background: none;
  border: 0;
  color: var(--rung);
  font-weight: 800;
  padding: 8px 4px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.muted { color: var(--muted); }
.center { text-align: center; }
.small { font-size: 0.86rem; }
.lead { margin: 0; font-size: 1.05rem; line-height: 1.45; }
.note { margin: 0; padding: 12px 14px; border-radius: 12px; background: rgba(94, 231, 255, 0.1); border: 1px solid rgba(94, 231, 255, 0.35); }
.err { margin: 0; color: #ffb3b3; font-weight: 700; }
p { margin: 0; line-height: 1.45; }

.dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18), 0 0 10px var(--c);
  flex: none;
}

/* ---------------------------------------------------------------- início */
.home-screen { justify-content: center; }

.home {
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.brand { text-align: center; }

.portraits {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
  margin-bottom: -6px;
}

.portraits canvas { width: 92px; height: 92px; }
.portraits canvas + canvas { width: 72px; height: 72px; }

.logo {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 0.92;
  letter-spacing: 0.02em;
}

.logo span:first-child {
  font-size: clamp(2.6rem, 13vw, 4rem);
  color: var(--steel);
  text-shadow: 0 4px 0 var(--steel-dk), 0 0 28px rgba(255, 84, 112, 0.45);
}

.logo span:last-child {
  font-size: clamp(2rem, 10vw, 3rem);
  color: var(--spark);
  text-shadow: 0 4px 0 #a8730a;
  padding: 0 14px;
  background:
    linear-gradient(var(--rung), var(--rung)) left 0 bottom 2px / 100% 3px no-repeat;
  padding-bottom: 8px;
}

.tag {
  margin: 12px auto 0;
  max-width: 34ch;
  color: #d9d4ff;
  font-weight: 700;
  text-wrap: balance;
}

.who {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 8px 8px 14px;
  border-radius: 14px;
  background: rgba(22, 18, 51, 0.85);
  border: 1px solid var(--line);
  min-width: 0;
}

.who-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu { display: flex; flex-direction: column; gap: 12px; }

.storage {
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}

.storage.on::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #5effa8;
  margin-right: 6px;
  vertical-align: 1px;
  box-shadow: 0 0 8px #5effa8;
}

.loading {
  margin: auto;
  text-align: center;
  display: grid;
  gap: 16px;
}

/* ---------------------------------------------------------------- contas */
.list { display: flex; flex-direction: column; gap: 8px; }

.prow { display: flex; align-items: center; gap: 6px; }
.prow.sel .pmain { border-color: var(--rung); background: rgba(94, 231, 255, 0.1); }

.pmain {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--panel);
  text-align: left;
}

.pname { font-weight: 800; font-size: 1.08rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbest { color: var(--spark); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lock { display: inline-grid; color: var(--muted); }
.lock svg { width: 16px; height: 16px; fill: currentColor; }

.empty {
  display: grid;
  gap: 4px;
  padding: 18px;
  border-radius: 14px;
  border: 2px dashed var(--line);
  text-align: center;
  color: var(--muted);
}

.empty b { color: var(--text); }

.newtop { display: flex; align-items: center; gap: 12px; }
.newtop canvas { width: 84px; height: 84px; flex: none; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); }
.newtop .field { flex: 1; min-width: 0; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-weight: 800; }
.field em { font-style: normal; font-weight: 600; color: var(--muted); font-size: 0.88rem; }

.field input {
  width: 100%;
  box-sizing: border-box;
  min-height: 52px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: #0f0c27;
  color: var(--text);
  font: 800 1.15rem var(--font-body);
  -webkit-user-select: text;
  user-select: text;
}

#inPin { letter-spacing: 0.5em; max-width: 180px; }

.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

.sw {
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 50%;
  border: 3px solid transparent;
  background: var(--c);
  padding: 0;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
}

.sw.on { border-color: #fff; box-shadow: 0 0 0 3px var(--c), inset 0 -4px 0 rgba(0, 0, 0, 0.25); }

.pinpad { align-items: center; text-align: center; }
.pinwho { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; flex-wrap: wrap; }
.dots { display: flex; gap: 14px; margin: 6px 0; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.on { background: var(--spark); border-color: var(--spark); }
.dots.shake { animation: shake 0.35s; }

@keyframes shake {
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }

.key {
  height: 64px;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: var(--panel-2);
  font: 400 1.5rem var(--font-display);
  box-shadow: 0 4px 0 #07051a;
}

.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #07051a; }

/* ---------------------------------------------------------------- modos e fases */
.mode {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 16px 18px;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: var(--panel);
  box-shadow: 0 4px 0 #07051a;
}

.mode b { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; color: var(--spark); letter-spacing: 0.03em; }
.mode span { color: #d9d4ff; }
.mode:active { transform: translateY(3px); box-shadow: 0 1px 0 #07051a; }

.sub {
  margin: 8px 0 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1rem;
  letter-spacing: 0.04em;
  color: var(--rose);
}

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 10px 4px;
  border-radius: 12px;
  border: 2px solid var(--c);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent), var(--panel);
  min-width: 0;
}

.tile b { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; }
.tile span { font-weight: 800; font-size: 0.82rem; }
.tile em { font-style: normal; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.tile.locked { opacity: 0.4; border-color: var(--line); }
.tile .lk { position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; }
.tile .lk svg { width: 100%; height: 100%; fill: currentColor; }

/* ---------------------------------------------------------------- ranking */
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.tabs button {
  min-height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font-weight: 800;
  color: var(--muted);
}

.tabs button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--steel); }

.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

.rank li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  min-width: 0;
}

.rank li.me { border-color: var(--rung); background: rgba(94, 231, 255, 0.08); }
.rank .pos { width: 26px; text-align: center; font-family: var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.rank li:nth-child(1) .pos { color: var(--spark); }
.rank li:nth-child(2) .pos { color: #dfe3f5; }
.rank li:nth-child(3) .pos { color: #ffb37a; }
.rname { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 800; overflow-wrap: anywhere; }
.rname small { font-weight: 600; color: var(--muted); }
.rscore { font-family: var(--font-display); color: var(--spark); font-variant-numeric: tabular-nums; white-space: nowrap; }
.duels .rname b { color: var(--spark); }

.ptable { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.pcard { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.pcard.me { border-color: var(--rung); }
.pc-top { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; margin-bottom: 10px; }
.pcard dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pcard dt { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.pcard dd { margin: 0; font-family: var(--font-display); font-variant-numeric: tabular-nums; }

.h2h { display: flex; flex-direction: column; gap: 8px; }

.vs {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.vs .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.vs .side b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.vs .side.r { justify-content: flex-end; }
.vs .big { font-family: var(--font-display); font-size: 1.8rem; color: var(--spark); }
.vs .mid { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-family: var(--font-display); }
.vs .mid small { font-family: var(--font-body); font-size: 0.72rem; white-space: nowrap; }

/* ---------------------------------------------------------------- ajuda e ajustes */
.help section { display: flex; flex-direction: column; gap: 8px; }
.help p { color: #d9d4ff; }
.keys-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.keys-list li { display: grid; grid-template-columns: minmax(96px, 30%) 1fr; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel); }
.keys-list b { color: var(--spark); }
.pts { width: 100%; border-collapse: collapse; }
.pts td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
.pts td:last-child { text-align: right; font-family: var(--font-display); color: var(--spark); font-variant-numeric: tabular-nums; white-space: nowrap; }

.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 56px;
  padding: 8px 16px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-weight: 800;
}

.toggle input { width: 26px; height: 26px; accent-color: var(--steel); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--rung); }

/* ---------------------------------------------------------------- pausa e fim */
.ptitle { margin: 0 0 4px; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 2rem; color: var(--spark); text-shadow: 0 3px 0 #a8730a; }
.winner { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.2rem; text-align: center; flex-wrap: wrap; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.res { padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }

<body>
<div id="app"></div>
<script>
(() => {
// ---- 00-util.js
'use strict';

// Mundo lógico do jogo (unidades do mundo, desenhado em vetor e escalado para a tela).
const W = 224;
const H = 256;
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = (p) => Math.random() < p;
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtScore(n) {
  return String(Math.max(0, Math.floor(n))).padStart(6, '0');
}

function fmtNum(n) {
  return Math.floor(n).toLocaleString('pt-BR');
}

function fmtDate(ms) {
  try {
    return new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
  } catch (e) {
    return '';
  }
}

// Gerador pseudoaleatório com semente (para cenários estáveis).
function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

// Mistura uma cor hex com preto (amt<0) ou branco (amt>0).
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255;
  const k = Math.abs(amt);
  r = Math.round(r + (t - r) * k);
  g = Math.round(g + (t - g) * k);
  b = Math.round(b + (t - b) * k);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

const LS = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  },
  del(key) {
    try { localStorage.removeItem(key); } catch (e) { /* sem armazenamento */ }
  },
};

// ---- 01-storage.js
// Armazenamento de contas, pontuações e duelos.
// Online (banco compartilhado do claude.ai, mesmo ranking no iPad e no celular) quando disponível,
// senão neste aparelho (localStorage).
const Store = (() => {
  const K = { profiles: 'lk.profiles', scores: 'lk.scores', duels: 'lk.duels' };
  let mode = 'local';
  let db = null;
  let profilesCache = null;

  async function init() {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try {
        const got = await Promise.race([
          c.use('db'),
          new Promise((r) => setTimeout(() => r(null), 7000)),
        ]);
        if (got) {
          db = got;
          mode = 'online';
        }
      } catch (e) {
        mode = 'local';
      }
    }
    return mode;
  }

  // Se uma escrita online falhar (sem permissão, por exemplo), continua salvando neste aparelho.
  function fallbackToLocal(err) {
    console.warn('Banco online indisponível, usando armazenamento local.', err);
    mode = 'local';
    db = null;
    profilesCache = null;
  }

  async function retry(fn) {
    try {
      return await fn();
    } catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        return fn();
      }
      throw e;
    }
  }

  async function sha(text) {
    try {
      if (window.crypto && crypto.subtle && window.TextEncoder) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* cai no hash simples abaixo */ }
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return 'f' + h.toString(16);
  }

  const hashPin = (pin, salt) => sha(salt + ':' + pin + ':lucas-kong');
  const nameKey = (name) => name.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function docsData(snap) {
    return snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  }

  async function listProfiles(force) {
    if (profilesCache && !force) return profilesCache;
    let list;
    if (mode === 'online') {
      try {
        list = docsData(await retry(() => db.collection('profiles').limit(500).get()));
      } catch (e) {
        fallbackToLocal(e);
        list = LS.get(K.profiles, []);
      }
    } else {
      list = LS.get(K.profiles, []);
    }
    list = list.filter((p) => p && p.name).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    profilesCache = list;
    return list;
  }

  async function createProfile({ name, color, pin }) {
    name = name.trim().replace(/\s+/g, ' ').slice(0, 14);
    const key = nameKey(name);
    const existing = await listProfiles(true);
    if (existing.some((p) => p.key === key)) {
      const err = new Error('Já existe uma conta com esse nome. Escolha outro.');
      err.code = 'name_taken';
      throw err;
    }
    const salt = uid();
    const profile = {
      id: 'p' + uid(),
      name,
      key,
      color,
      salt,
      pin: pin ? await hashPin(pin, salt) : '',
      createdAt: Date.now(),
    };
    const body = Object.assign({}, profile);
    delete body.id;
    if (mode === 'online') {
      try {
        await retry(() => db.collection('profiles').doc(profile.id).set(body));
      } catch (e) {
        fallbackToLocal(e);
      }
    }
    if (mode === 'local') {
      const list = LS.get(K.profiles, []);
      list.push(profile);
      LS.set(K.profiles, list);
    }
    profilesCache = null;
    return profile;
  }

  async function verifyPin(profile, pin) {
    if (!profile.pin) return true;
    return (await hashPin(pin, profile.salt)) === profile.pin;
  }

  async function deleteProfile(id) {
    if (mode === 'online') {
      try {
        await retry(() => db.collection('profiles').doc(id).delete());
        const snap = await retry(() => db.collection('scores').where('pid', '==', id).limit(1000).get());
        for (const d of snap.docs) {
          await retry(() => db.collection('scores').doc(d.id).delete());
        }
      } catch (e) {
        fallbackToLocal(e);
      }
    }
    if (mode === 'local') {
      LS.set(K.profiles, LS.get(K.profiles, []).filter((p) => p.id !== id));
      LS.set(K.scores, LS.get(K.scores, []).filter((s) => s.pid !== id));
    }
    profilesCache = null;
  }

  async function addScore(rec) {
    const body = Object.assign({ at: Date.now() }, rec);
    if (mode === 'online') {
      try {
        await retry(() => db.collection('scores').doc('s' + uid()).set(body));
        return;
      } catch (e) {
        if (e && e.code === 'quota_exceeded') throw e;
        fallbackToLocal(e);
      }
    }
    const list = LS.get(K.scores, []);
    list.push(Object.assign({ id: 's' + uid() }, body));
    // Mantém o arquivo local enxuto: as 300 melhores + as 200 mais recentes.
    if (list.length > 600) {
      const best = list.slice().sort((a, b) => b.score - a.score).slice(0, 300);
      const recent = list.slice().sort((a, b) => b.at - a.at).slice(0, 200);
      const keep = new Map();
      best.concat(recent).forEach((s) => keep.set(s.id, s));
      LS.set(K.scores, Array.from(keep.values()));
    } else {
      LS.set(K.scores, list);
    }
  }

  async function allScores() {
    if (mode === 'online') {
      try {
        return docsData(await retry(() => db.collection('scores').orderBy('at', 'desc').limit(1000).get()));
      } catch (e) {
        fallbackToLocal(e);
      }
    }
    return LS.get(K.scores, []).slice().sort((a, b) => b.at - a.at);
  }

  async function addDuel(rec) {
    const body = Object.assign({ at: Date.now() }, rec);
    if (mode === 'online') {
      try {
        await retry(() => db.collection('duels').doc('d' + uid()).set(body));
        return;
      } catch (e) {
        fallbackToLocal(e);
      }
    }
    const list = LS.get(K.duels, []);
    list.push(Object.assign({ id: 'd' + uid() }, body));
    LS.set(K.duels, list.slice(-400));
  }

  async function listDuels() {
    if (mode === 'online') {
      try {
        return docsData(await retry(() => db.collection('duels').orderBy('at', 'desc').limit(300).get()));
      } catch (e) {
        fallbackToLocal(e);
      }
    }
    return LS.get(K.duels, []).slice().sort((a, b) => b.at - a.at);
  }

  return {
    init,
    get mode() { return mode; },
    listProfiles,
    createProfile,
    verifyPin,
    deleteProfile,
    addScore,
    allScores,
    addDuel,
    listDuels,
  };
})();

// ---- 02-audio.js
// Sons sintetizados com WebAudio (sem arquivos externos).
const Sound = (() => {
  let ctx = null;
  let master = null;
  let sfxBus = null;
  let musBus = null;
  let sfxOn = LS.get('lk.sfx', true);
  let musOn = LS.get('lk.music', true);
  let song = null;
  let step = 0;
  let nextTime = 0;

  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
      } catch (e) {
        return;
      }
      master = ctx.createGain();
      master.gain.value = 0.8;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 4;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = sfxOn ? 0.55 : 0;
      sfxBus.connect(master);
      musBus = ctx.createGain();
      musBus.gain.value = musOn ? 0.22 : 0;
      musBus.connect(master);
      setInterval(schedule, 40);
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }

  const mfreq = (n) => 440 * Math.pow(2, (n - 69) / 12);

  function tone(o) {
    if (!ctx) return;
    const t0 = (o.at || ctx.currentTime) + (o.delay || 0);
    const dur = o.dur || 0.1;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    const vol = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = osc;
    if (o.lp) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = o.lp;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.bus || sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  let noiseBuf = null;
  function noise(o) {
    if (!ctx) return;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = (o.at || ctx.currentTime) + (o.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = o.ftype || 'bandpass';
    f.frequency.value = o.freq || 1200;
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(o.vol || 0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.dur || 0.15));
    src.connect(f);
    f.connect(g);
    g.connect(o.bus || sfxBus);
    src.start(t0);
    src.stop(t0 + (o.dur || 0.15) + 0.05);
  }

  const sfx = {
    jump() { tone({ freq: 330, to: 820, dur: 0.14, type: 'square', vol: 0.12, lp: 2600 }); },
    land() { tone({ freq: 140, to: 60, dur: 0.08, type: 'triangle', vol: 0.18 }); },
    step(i) { tone({ freq: i ? 210 : 165, to: i ? 150 : 120, dur: 0.05, type: 'triangle', vol: 0.07 }); },
    climb(i) { tone({ freq: i ? 520 : 440, dur: 0.035, type: 'triangle', vol: 0.05 }); },
    score() {
      tone({ freq: 988, dur: 0.07, type: 'square', vol: 0.09, lp: 4000 });
      tone({ freq: 1319, dur: 0.12, type: 'square', vol: 0.09, lp: 4000, delay: 0.07 });
    },
    hammer() {
      [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.09, vol: 0.1, delay: i * 0.05, lp: 3500 }));
    },
    smash() {
      noise({ dur: 0.22, vol: 0.45, freq: 900, q: 0.7 });
      tone({ freq: 300, to: 70, dur: 0.2, type: 'sawtooth', vol: 0.12, lp: 1400 });
    },
    die() {
      [784, 740, 659, 587, 523, 440, 392, 330].forEach((f, i) =>
        tone({ freq: f, to: f * 0.94, dur: 0.11, type: 'square', vol: 0.12, delay: i * 0.1, lp: 3000 }));
      noise({ dur: 0.35, vol: 0.2, freq: 300, delay: 0.85, ftype: 'lowpass' });
    },
    clear() {
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) =>
        tone({ freq: f, dur: i === 6 ? 0.5 : 0.13, type: 'square', vol: 0.11, delay: i * 0.11, lp: 4200 }));
    },
    rescue() {
      const mel = [659, 784, 880, 1047, 880, 1047, 1175, 1319, 1568];
      mel.forEach((f, i) => tone({ freq: f, dur: i === mel.length - 1 ? 0.8 : 0.16, type: 'triangle', vol: 0.16, delay: i * 0.14 }));
      mel.forEach((f, i) => tone({ freq: f / 2, dur: 0.16, type: 'square', vol: 0.05, delay: i * 0.14, lp: 1500 }));
    },
    rivet() {
      tone({ freq: 1760, to: 1200, dur: 0.12, type: 'triangle', vol: 0.14 });
      noise({ dur: 0.06, vol: 0.12, freq: 5000 });
    },
    item() {
      [880, 1109, 1319, 1760].forEach((f, i) => tone({ freq: f, dur: 0.1, type: 'triangle', vol: 0.14, delay: i * 0.06 }));
    },
    spring() { tone({ freq: 180, to: 520, dur: 0.12, type: 'sine', vol: 0.12 }); },
    oneup() {
      [659, 784, 1319, 1047, 1175, 1568].forEach((f, i) => tone({ freq: f, dur: 0.09, vol: 0.1, delay: i * 0.08, lp: 4000 }));
    },
    tick() { tone({ freq: 1400, dur: 0.03, type: 'square', vol: 0.05, lp: 5000 }); },
    fire() { noise({ dur: 0.4, vol: 0.18, freq: 500, q: 0.5 }); },
    thud() {
      tone({ freq: 90, to: 40, dur: 0.35, type: 'sine', vol: 0.35 });
      noise({ dur: 0.3, vol: 0.25, freq: 200, ftype: 'lowpass' });
    },
    roar() { tone({ freq: 110, to: 70, dur: 0.4, type: 'sawtooth', vol: 0.12, lp: 600 }); },
    click() { tone({ freq: 660, dur: 0.04, type: 'triangle', vol: 0.08 }); },
    start() {
      [392, 523, 659, 784, 659, 784].forEach((f, i) => tone({ freq: f, dur: 0.12, vol: 0.1, delay: i * 0.1, lp: 3800 }));
    },
  };

  // Trilhas curtas em loop (passos de colcheia). n = nota MIDI, null = pausa.
  const _ = null;
  const SONGS = {
    barrels: {
      bpm: 138,
      bass: [36, _, 43, _, 36, _, 43, _, 32, _, 39, _, 34, _, 41, _],
      lead: [72, _, 75, 79, _, 77, 75, _, 74, _, 70, _, 72, _, _, _, 72, _, 75, 79, _, 80, 79, _, 77, _, 75, _, 74, _, _, _],
    },
    conveyor: {
      bpm: 146,
      bass: [38, 50, 38, 50, 41, 53, 41, 53, 36, 48, 36, 48, 43, 55, 43, 55],
      lead: [74, _, 77, _, 81, _, 79, 77, _, _, 76, _, 74, _, _, _, 72, _, 76, _, 79, _, 81, 79, _, _, 77, _, 76, _, 74, _],
    },
    elevator: {
      bpm: 120,
      bass: [41, _, 48, _, 45, _, 48, _, 43, _, 50, _, 46, _, 50, _],
      lead: [77, _, _, 81, _, 84, _, 81, 79, _, _, 82, _, 86, _, 82, 77, _, 81, _, 84, _, 89, _, 88, _, 86, _, 84, _, _, _],
    },
    rivets: {
      bpm: 152,
      bass: [33, 45, 33, 45, 36, 48, 36, 48, 31, 43, 31, 43, 32, 44, 34, 46],
      lead: [69, 72, 76, 72, 69, _, 81, _, 79, 76, 72, _, 74, _, _, _, 69, 72, 76, 79, 81, _, 84, _, 83, 79, 76, _, 77, _, 76, _],
    },
    hammer: {
      bpm: 176,
      bass: [36, 48, 36, 48, 41, 53, 41, 53, 43, 55, 43, 55, 41, 53, 43, 55],
      lead: [72, 76, 79, 84, 79, 76, 77, 81, 84, 89, 84, 81, 79, 83, 86, 91, 86, 83, 77, 81, 84, 89, 84, 81, 79, 83, 86, 83, 79, 76, 79, 83],
    },
    menu: {
      bpm: 112,
      bass: [36, _, _, 43, _, _, 41, _, 39, _, _, 43, _, _, 38, _],
      lead: [72, _, 74, 75, _, 79, _, 77, 75, _, 74, _, 72, _, _, _, 70, _, 72, 74, _, 77, _, 75, 74, _, 72, _, 74, _, _, _],
    },
  };

  function schedule() {
    if (!ctx || !song || !musOn) return;
    const s = SONGS[song];
    if (!s) return;
    const dur = 60 / s.bpm / 2;
    if (nextTime < ctx.currentTime - 0.1) nextTime = ctx.currentTime + 0.03;
    while (nextTime < ctx.currentTime + 0.18) {
      const b = s.bass[step % s.bass.length];
      const l = s.lead[step % s.lead.length];
      if (b != null) tone({ at: nextTime, freq: mfreq(b), dur: dur * 0.9, type: 'triangle', vol: 0.5, bus: musBus });
      if (l != null) tone({ at: nextTime, freq: mfreq(l), dur: dur * 0.8, type: 'square', vol: 0.16, lp: 2200, bus: musBus });
      if (step % 4 === 0) noise({ at: nextTime, dur: 0.05, vol: 0.12, freq: 6000, ftype: 'highpass', bus: musBus });
      step++;
      nextTime += dur;
    }
  }

  function music(name) {
    if (song === name) return;
    song = name;
    step = 0;
    if (ctx) nextTime = ctx.currentTime + 0.06;
  }

  function setSfx(on) {
    sfxOn = on;
    LS.set('lk.sfx', on);
    if (sfxBus) sfxBus.gain.value = on ? 0.55 : 0;
  }

  function setMusic(on) {
    musOn = on;
    LS.set('lk.music', on);
    if (musBus) musBus.gain.value = on ? 0.22 : 0;
  }

  function play(name, arg) {
    if (!ctx || !sfxOn || !sfx[name]) return;
    try { sfx[name](arg); } catch (e) { /* áudio é opcional */ }
  }

  return {
    unlock,
    play,
    music,
    get sfxOn() { return sfxOn; },
    get musicOn() { return musOn; },
    setSfx,
    setMusic,
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); },
  };
})();

// ---- 03-input.js
// Entrada: teclado, controles de toque e gamepad, para até 2 jogadores.
const Input = (() => {
  const mk = () => ({ left: false, right: false, up: false, down: false, jump: false, jumpQ: false });
  const touch = [mk(), mk()];
  const keyQ = [false, false];
  const prevJump = [false, false];
  const keys = new Set();
  let duel = false;

  const SOLO = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'KeyZ', 'KeyX', 'KeyK', 'KeyJ'],
  };
  const DUEL = [
    { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], jump: ['Space', 'KeyF', 'KeyG'] },
    { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], jump: ['Enter', 'NumpadEnter', 'KeyL', 'Slash', 'ShiftRight'] },
  ];

  function mapFor(i) {
    return duel ? DUEL[i] : i === 0 ? SOLO : null;
  }

  const isTyping = (e) => {
    const t = e.target;
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  };

  window.addEventListener('keydown', (e) => {
    if (isTyping(e)) return;
    if (!keys.has(e.code)) {
      for (let i = 0; i < 2; i++) {
        const m = mapFor(i);
        if (m && m.jump.includes(e.code)) keyQ[i] = true;
      }
    }
    keys.add(e.code);
    if (Input.captureKeys && /^(Arrow|Space)/.test(e.code)) e.preventDefault();
    if (Input.onKey) Input.onKey(e);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));
  window.addEventListener('blur', () => {
    keys.clear();
    touch.forEach((t) => Object.assign(t, mk()));
  });

  const anyKey = (list) => list.some((c) => keys.has(c));

  function readPad(i) {
    const out = mk();
    if (!navigator.getGamepads) return out;
    let pads;
    try { pads = navigator.getGamepads(); } catch (e) { return out; }
    const gp = pads && pads[i];
    if (!gp || !gp.connected) return out;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const b = (n) => gp.buttons[n] && gp.buttons[n].pressed;
    out.left = ax < -0.4 || b(14);
    out.right = ax > 0.4 || b(15);
    out.up = ay < -0.5 || b(12);
    out.down = ay > 0.5 || b(13);
    out.jump = b(0) || b(1) || b(2) || b(3);
    return out;
  }

  // Estado do jogador i neste quadro (jumpPressed = acabou de apertar).
  function poll(i) {
    const m = mapFor(i);
    const t = touch[i];
    const g = readPad(i);
    const s = {
      left: t.left || g.left || (m ? anyKey(m.left) : false),
      right: t.right || g.right || (m ? anyKey(m.right) : false),
      up: t.up || g.up || (m ? anyKey(m.up) : false),
      down: t.down || g.down || (m ? anyKey(m.down) : false),
      jump: t.jump || g.jump || (m ? anyKey(m.jump) : false),
    };
    s.jumpPressed = t.jumpQ || keyQ[i] || (g.jump && !prevJump[i]);
    prevJump[i] = g.jump;
    t.jumpQ = false;
    keyQ[i] = false;
    return s;
  }

  // Direcional virtual: aceita diagonais (útil para segurar direita + cima perto da escada).
  function bindPad(el, i) {
    const active = new Map();
    const update = () => {
      const t = touch[i];
      t.left = t.right = t.up = t.down = false;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const rad = r.width / 2;
      for (const p of active.values()) {
        const dx = (p.x - cx) / rad, dy = (p.y - cy) / rad;
        const dead = 0.2;
        if (dx < -dead && Math.abs(dx) > Math.abs(dy) * 0.45) t.left = true;
        if (dx > dead && Math.abs(dx) > Math.abs(dy) * 0.45) t.right = true;
        if (dy < -dead && Math.abs(dy) > Math.abs(dx) * 0.45) t.up = true;
        if (dy > dead && Math.abs(dy) > Math.abs(dx) * 0.45) t.down = true;
      }
      el.dataset.dir = (t.up ? 'u' : '') + (t.down ? 'd' : '') + (t.left ? 'l' : '') + (t.right ? 'r' : '');
    };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      Sound.unlock();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
      active.set(e.pointerId, { x: e.clientX, y: e.clientY });
      update();
    });
    el.addEventListener('pointermove', (e) => {
      if (!active.has(e.pointerId)) return;
      e.preventDefault();
      active.set(e.pointerId, { x: e.clientX, y: e.clientY });
      update();
    });
    const end = (e) => {
      active.delete(e.pointerId);
      update();
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  }

  function bindJump(el, i) {
    const active = new Set();
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      Sound.unlock();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
      active.add(e.pointerId);
      touch[i].jump = true;
      touch[i].jumpQ = true;
      el.classList.add('down');
    });
    const end = (e) => {
      active.delete(e.pointerId);
      if (!active.size) {
        touch[i].jump = false;
        el.classList.remove('down');
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  }

  function reset() {
    touch.forEach((t) => Object.assign(t, mk()));
    keyQ[0] = keyQ[1] = false;
  }

  return {
    poll,
    bindPad,
    bindJump,
    reset,
    setDuel(v) { duel = v; },
    captureKeys: false,
    onKey: null,
  };
})();

// ---- 04-art.js
// Desenho vetorial de tudo no jogo (nítido em qualquer tela, sem pixels).
const THEMES = [
  {
    name: 'Noite na obra',
    sky: ['#070b24', '#171447', '#3b1d5e'],
    girder: '#ff5470', girderHi: '#ffb1c0', girderLo: '#7e1235',
    ladder: '#5ee7ff', city: '#120f33', city2: '#1d1850', win: '#ffd66b', moon: '#fff4d6',
  },
  {
    name: 'Pôr do sol',
    sky: ['#1a1242', '#6b2a6e', '#ff8a5b'],
    girder: '#22c7b8', girderHi: '#b5fff6', girderLo: '#0b5c56',
    ladder: '#ffd23f', city: '#2a1238', city2: '#4a1f52', win: '#ffe3a3', moon: '#ffe9c2',
  },
  {
    name: 'Madrugada',
    sky: ['#03161f', '#0b3a4a', '#1a6b6e'],
    girder: '#ffb703', girderHi: '#ffe8a3', girderLo: '#8a5200',
    ladder: '#ff6b9a', city: '#04202a', city2: '#0a3341', win: '#9ff3ff', moon: '#e6fbff',
  },
  {
